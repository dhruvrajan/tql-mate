[package]
name = "tqlmate"
version = "0.1.3"
edition = "2021"
description = "dbmate-style migration CLI for TypeDB 3.x"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dhruvrajan/tqlmate"
homepage = "https://github.com/dhruvrajan/tqlmate"
keywords = ["typedb", "migration", "typeql", "database", "cli"]
categories = ["command-line-utilities", "database"]
exclude = [".github/", ".env.example"]

[[bin]]
name = "tqlmate"
path = "src/main.rs"

[features]
default = ["typedb-docker"]
# Compiles `tests/typedb_docker.rs` (TypeDB via testcontainers). Offline unit
# targets: `cargo test --no-default-features --test url --test migration --test ledger --test cli`.
typedb-docker = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
typedb-driver = "3.12.3"

[dev-dependencies]
tempfile = "3"
testcontainers = "0.28"
