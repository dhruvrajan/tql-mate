name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TYPEDB_URL: typedb://admin:password@127.0.0.1:1729/tqlmate_ci

jobs:
  rust-test:
    name: rust unit + docker integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests (no TypeDB / no Docker)
        run: cargo test --lib --bins
      - name: Integration tests (TypeDB via testcontainers)
        run: cargo test --features typedb-docker --test integration -- --nocapture --test-threads=1

  scala-test:
    name: scala unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: VirtusLab/scala-cli-setup@v2
        with:
          jvm: "temurin:21"
          power: true
      - name: Setup TypeDB
        uses: typedb/setup-typedb@1.0.0
        with:
          typedb_version: "3.12.3"
          typedb_grpc_port: "1729"
      - name: Wait for TypeDB
        working-directory: scala
        run: scala-cli run . -- wait --timeout 120 -u "${TYPEDB_URL}"
      - name: Tests
        working-directory: scala
        run: scala-cli test .
        env:
          TQLMATE_REQUIRE_TYPEDB: "1"

  scala-native-image:
    name: scala native-image (linux amd64)
    needs: scala-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: VirtusLab/scala-cli-setup@v2
        with:
          jvm: "temurin:21"
          power: true
      - name: Setup TypeDB
        uses: typedb/setup-typedb@1.0.0
        with:
          typedb_version: "3.12.3"
          typedb_grpc_port: "1729"
      - name: Package native-image
        working-directory: scala
        run: |
          scala-cli --power package --native-image . \
            --force -o tqlmate-scala \
            --graalvm-args --no-fallback \
            --graalvm-args --enable-url-protocols=http,https \
            --graalvm-args -H:+ReportExceptionStackTraces
          ./tqlmate-scala --help
          ./tqlmate-scala -u "${TYPEDB_URL}" create
          ./tqlmate-scala -u "${TYPEDB_URL}" status
          ./tqlmate-scala -u "${TYPEDB_URL}" drop
        env:
          TYPEDB_URL: typedb://admin:password@127.0.0.1:1729/tqlmate_scala_ni
      - uses: actions/upload-artifact@v4
        with:
          name: tqlmate-scala-x86_64-linux
          path: scala/tqlmate-scala

  rust-build:
    needs: rust-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tqlmate-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/tqlmate
            target/${{ matrix.target }}/release/tqlmate.exe
