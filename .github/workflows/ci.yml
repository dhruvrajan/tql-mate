name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TYPEDB_URL: typedb://admin:password@127.0.0.1:1729/tqlmate_ci

jobs:
  test:
    name: unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup TypeDB
        uses: typedb/setup-typedb@1.0.0
        with:
          typedb_version: "3.12.3"
          typedb_grpc_port: "1729"

      - name: Wait for TypeDB
        run: cargo run -q -- wait --timeout 120 -u "${TYPEDB_URL}"

      - name: Unit tests
        run: cargo test --lib --bins

      - name: Integration tests
        run: cargo test --test integration -- --nocapture
        env:
          TQLMATE_REQUIRE_TYPEDB: "1"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tqlmate-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/tqlmate
            target/${{ matrix.target }}/release/tqlmate.exe
